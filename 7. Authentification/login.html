<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>CampusConnect | Log In</title>
	<link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>
	<div class="form-container">
		<h1 class="header">CampusConnect</h1>
		<hr>
		<h2>Welcome back</h2>
		<form id="login-form">
			<input type="email" placeholder="Enter email" id="login-email" required />
			<input type="password" placeholder="Enter password" id="login-password" required />
			<button type="submit">Login</button>
			<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
		</form>
	</div>
</body>
</html>
